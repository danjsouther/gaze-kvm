; gazekvm configuration. Lives next to gazekvm.exe.
; "main" = the PC running gazekvm (Deskflow server, eye tracker on its monitor).
; "side" = the other PC (Deskflow client), currently assumed to be to the LEFT.
; --calibrate rewrites the [calibration] section.

[calibration]
main_yaw = 0
side_yaw = -30
; Head yaw/pitch range measured at the main screen's four corners. A vote for
; the main screen needs the head inside this box (plus box_margin_deg), so
; looking down at a keyboard under the monitor holds the current screen.
; Equal min/max = disabled.
box_yaw_min = 0
box_yaw_max = 0
box_pitch_min = 0
box_pitch_max = 0

[thresholds]
; score = (yaw - main_yaw) / (side_yaw - main_yaw): ~0 on the main screen, ~1 on the side screen
enter_score = 0.6
exit_score = 0.4
; gaze X is normalized to [-1, 1] over the main monitor (VERIFY with --debug)
gaze_left_edge = -1.0
gaze_margin = 0.05
; degrees added around the calibrated main-screen box
box_margin_deg = 4
dwell_to_side_ms = 250
dwell_to_main_ms = 150
typing_hold_ms = 500

[hotkeys]
; must match the keystroke(...) lines in Deskflow's server config
modifiers = ctrl+alt+shift
to_side = F11
to_main = F12
pause = P

[source]
; auto = Tobii SDK if this build has it, else core if gazekvm-tobii.exe is
;        installed, else udp
; tgi  = Tobii Game Integration SDK (gaze + head pose + presence)
; core = Tobii.Interaction via the gazekvm-tobii.exe helper (gaze + head pose
;        + presence; needs only Tobii Experience)
; udp  = opentrack "UDP over network" packets, e.g. Tobii Game Hub's opentrack
;        output (head pose only; close opentrack itself, it uses the same port)
type = auto
udp_bind = 127.0.0.1
udp_port = 4242
; no packet for this long = not present
udp_stale_ms = 200
; pose values identical for this long = sender is repeating a lost pose
udp_frozen_ms = 500
; Game Hub only sends while opentrack.exe is running. Start it (minimized) if
; it isn't. Never press Start in opentrack: it would take port 4242.
opentrack_autostart = true
; empty = find the install automatically
opentrack_path =
; core source: localhost port the helper sends to, and how long without a
; packet counts as "not present"
core_port = 4243
core_stale_ms = 200
; empty = gazekvm-tobii.exe next to gazekvm.exe
core_helper =

[switching]
; hotkey = send the Deskflow hotkeys above
; edge   = fallback A: push the cursor with relative motion across the left/right edge
method = hotkey
